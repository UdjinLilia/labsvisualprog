name: Run Tests

on:
  push:
    branches: [ lab1 ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    
    - name: Install and test
      run: |
        npm init -y
        npm install vitest
        echo "import { test, expect } from 'vitest'; test('simple', () => expect(1).toBe(1));" > test.js
        npx vitest run
